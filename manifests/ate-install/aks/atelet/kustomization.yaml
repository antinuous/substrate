apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet-${SUBSTRATE_VERSION_SUFFIX}
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
              - name: atelet
                env:
                  - name: ATE_STORAGE_BACKEND
                    $patch: delete
                volumeMounts:
                  - name: aws-web-identity-token
                    mountPath: /var/run/secrets/sts.amazonaws.com/serviceaccount
                    readOnly: true
            volumes:
              - name: image-credential-provider-bin
                hostPath:
                  path: /var/lib/kubelet/credential-provider
              - name: image-credential-provider-config
                hostPath:
                  path: /var/lib/kubelet/credential-provider-config.yaml
              - name: aws-web-identity-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: sts.amazonaws.com
                        expirationSeconds: 86400
                        path: token
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: atelet-.*
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: ate-storage-config
